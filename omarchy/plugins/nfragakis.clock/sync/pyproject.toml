[project]
name = "omarchy-calendar-dashboard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.179,<3",
  "google-auth-oauthlib>=1.2,<2",
  "msal>=1.33,<2",
]

[project.scripts]
omarchy-calendar-dashboard = "agenda_sync.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agenda_sync"]
